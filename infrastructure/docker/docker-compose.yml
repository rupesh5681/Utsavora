# Local/staging stack. Production should use managed PostgreSQL with automated backups.
#   docker compose -f infrastructure/docker/docker-compose.yml up --build
#   docker compose -f infrastructure/docker/docker-compose.yml run --rm api node dist/db/seed.js
name: utsavora
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: utsavora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-utsavora}
      POSTGRES_DB: utsavora
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U utsavora"]
      interval: 5s
      retries: 10
  api:
    build: { context: ../.., dockerfile: infrastructure/docker/api.Dockerfile }
    environment:
      DATABASE_URL: postgresql://utsavora:${POSTGRES_PASSWORD:-utsavora}@db:5432/utsavora
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@utsavora.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?set SEED_ADMIN_PASSWORD}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
    depends_on: { db: { condition: service_healthy } }
    ports: ["4000:4000"]
  customer-web:
    build: { context: ../.., dockerfile: infrastructure/docker/web.Dockerfile, args: { APP: customer-web, API_INTERNAL_URL: http://api:4000 } }
    depends_on: [api]
    ports: ["3000:3000"]
  vendor-portal:
    build: { context: ../.., dockerfile: infrastructure/docker/web.Dockerfile, args: { APP: vendor-portal, API_INTERNAL_URL: http://api:4000 } }
    depends_on: [api]
    ports: ["3001:3000"]
  admin-portal:
    build: { context: ../.., dockerfile: infrastructure/docker/web.Dockerfile, args: { APP: admin-portal, API_INTERNAL_URL: http://api:4000 } }
    depends_on: [api]
    ports: ["3002:3000"]
volumes:
  pgdata:
